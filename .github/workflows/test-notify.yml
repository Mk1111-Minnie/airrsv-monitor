name: 通知テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -X POST \
            -H "Title: Airリザーブ監視テスト" \
            -H "Priority: high" \
            -d "通知テストです。iPhoneにこの通知が届けば設定完了です。" \
            "https://ntfy.sh/${NTFY_TOPIC}"
